plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sacredverses.daily'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No external dependencies: pure Android framework on purpose,
    // so the app builds anywhere (including this project's manual build script).
    // AdMob SDK can be added here later when monetization is switched on.
}
